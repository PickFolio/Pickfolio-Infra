services:
  db:
    image: postgres:13
    container_name: pickfolio_db
    environment:
      POSTGRES_USER: pickfolio_user
      POSTGRES_PASSWORD: pickfolio_pass
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickfolio_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: './Backend/Auth Service'
    container_name: auth-service
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/pickfolio_auth
      - SPRING_DATASOURCE_USERNAME=pickfolio_user
      - SPRING_DATASOURCE_PASSWORD=pickfolio_pass
      - JWT_SECRET=${JWT_SECRET_KEY}

  contest-service:
    build: './Backend/Contest Service'
    container_name: contest-service
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/pickfolio_contest
      - SPRING_DATASOURCE_USERNAME=pickfolio_user
      - SPRING_DATASOURCE_PASSWORD=pickfolio_pass
      - EXTERNAL_API_PROPERTIES_AUTH_SERVICE_WEB_CLIENT_BASE_URL=http://auth-service:8080
      - EXTERNAL_API_PROPERTIES_MARKET_DATA_WEB_CLIENT_BASE_URL=http://market-data-service:8082/api/market-data
      - EXTERNAL_API_PROPERTIES_MARKET_DATA_WEB_SOCKET_BASE_URL=ws://market-data-service:8082/ws/market-data
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-service:8080/oauth2/jwks

  market-data-service:
    build: './Backend/Market Data Service'
    container_name: market-data-service
    ports:
      - "8082:8082"
    depends_on:
      contest-service:
        condition: service_started
    environment:
      - CONTEST_SERVICE_URL=http://contest-service:8081/api/internal/contests/active-symbols

  pickfolio-ui:
    build:
      context: './Frontend/v2/pickfolio-ui'
      dockerfile: Dockerfile
    container_name: pickfolio-ui
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - contest-service

  ai-agent-service:
    build: '../Backend/AI Agent Service'
    container_name: ai-agent-service
    depends_on:
      - auth-service
      - contest-service
      - market-data-service
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8080
      - CONTEST_SERVICE_URL=http://contest-service:8081
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8082

volumes:
  postgres_data:
